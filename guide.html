<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coast · 使用说明</title>
<link rel="icon" href="assets/favicon.png" type="image/png">
<style>
  :root {
    --page: #f6f7f9; --ink: #0f1a2e; --ink-2: rgba(15,26,46,.62); --ink-3: rgba(15,26,46,.42);
    --grid: rgba(15,26,46,.10); --accent: #007aff;
    --serif: "Songti SC", "Noto Serif SC", "Source Han Serif SC", Georgia, "Times New Roman", serif;
    --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Helvetica Neue", Helvetica, Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --page: #101418; --ink: #eef1f5; --ink-2: rgba(238,241,245,.66); --ink-3: rgba(238,241,245,.44); --grid: rgba(238,241,245,.10); --accent: #409cff; }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--page); color: var(--ink); font-family: var(--sans); line-height: 1.7; -webkit-font-smoothing: antialiased; }
  a { color: var(--accent); text-decoration: none; }
  main { max-width: 680px; margin: 0 auto; padding: 48px 24px 96px; }
  .back { font-size: 14px; color: var(--ink-3); display: inline-block; margin-bottom: 36px; }
  h1 { font-family: var(--serif); font-size: 32px; font-weight: 600; letter-spacing: -0.01em; }
  .tagline { color: var(--ink-2); font-size: 17px; margin: 8px 0 40px; }
  .empty { border: 1px dashed var(--grid); border-radius: 14px; padding: 40px 24px; text-align: center; color: var(--ink-3); font-size: 15px; }
  footer { margin-top: 64px; padding-top: 20px; border-top: 1px solid var(--grid); color: var(--ink-3); font-size: 13px; }
  footer a { color: inherit; margin-right: 14px; }
</style>
</head>
<body>
<main>
  <a class="back" href="index.html">← Coast</a>
  <h1>使用说明</h1>
  <p class="tagline">从导入第一笔账，到看懂自由倒计时。</p>
  <div class="empty">内容整理中。有问题先写信到 <a href="mailto:hi@thisleon.com">hi@thisleon.com</a>。</div>
  <footer>
    <a href="index.html">首页</a>
    <a href="privacy.html">隐私政策</a>
    <a href="changelog.html">更新日志</a>
  </footer>
</main>
</body>
</html>
